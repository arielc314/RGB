<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow-r">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-g">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-b">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark background with rounded corners -->
  <rect width="100" height="100" rx="18" ry="18" fill="#0d0d1a"/>

  <!-- Subtle inner border -->
  <rect width="100" height="100" rx="18" ry="18" fill="none" stroke="#ffffff10" stroke-width="1.5"/>

  <!-- Three colored dots at the top -->
  <circle cx="30" cy="22" r="4" fill="#ff3b3b" opacity="0.85"/>
  <circle cx="50" cy="22" r="4" fill="#3bff6f" opacity="0.85"/>
  <circle cx="70" cy="22" r="4" fill="#3b8bff" opacity="0.85"/>

  <!-- R letter -->
  <text
    x="18"
    y="76"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="46"
    fill="#ff3b3b"
    filter="url(#glow-r)"
    letter-spacing="-1"
  >R</text>

  <!-- G letter -->
  <text
    x="36"
    y="76"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="46"
    fill="#3bff6f"
    filter="url(#glow-g)"
    letter-spacing="-1"
  >G</text>

  <!-- B letter -->
  <text
    x="63"
    y="76"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="46"
    fill="#3b8bff"
    filter="url(#glow-b)"
    letter-spacing="-1"
  >B</text>
</svg>
